<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adrian SEIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --card: #f4f5f7;
  --input-bg: #ffffff;
  --border: #d8dce5;
  --accent: #0067b1;
  --accent-glow: rgba(0, 103, 177, 0.15);
  --navy: #1b2838;
  --text-dim: #6b7a8d;
  --white: #ffffff;
  --shadow: 0 2px 12px rgba(27, 40, 56, 0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Open Sans', Arial, sans-serif;
  background: var(--bg);
  color: var(--navy);
}

.wrap {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 2rem 24px 3rem;
}

/* Tabs */
.site-tabs {
  display: flex;
  justify-content: center;
  gap: 1.75rem;
  border-bottom: 1px solid var(--border);
}
.site-tabs a {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  text-decoration: none;
  padding: 0.25rem 0.1rem 0.7rem;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.2s, border-color 0.2s;
}
.site-tabs a:hover { color: var(--navy); }
.site-tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }

.view[hidden] { display: none !important; }
.view { animation: fadeUp 0.35s ease-out; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Header (matches the timeline image) */
.header { text-align: center; padding-top: 2.4rem; margin-bottom: 2.1rem; }
.logos { display: flex; align-items: center; justify-content: center; gap: 44px; margin-bottom: 1.6rem; }
.logos img { display: block; }
.logos .adrian { height: 34.9px; }
.logos .lushin { height: 27.1px; }
.title { font-size: 1.2rem; line-height: 1.3; font-weight: 600; color: var(--navy);  text-wrap: balance; }
.label { margin-top: 0.35rem; font-size: 0.75rem; font-weight: 800; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }

/* Inputs */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem;
  box-shadow: var(--shadow);
  margin-bottom: 1.25rem;
}

.rows { display: flex; flex-direction: column; gap: 0.5rem; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 0.75rem 1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--white);
}
.row label { font-size: 0.9rem; font-weight: 700; color: var(--navy); }
.row input {
  width: 8.5rem;
  flex-shrink: 0;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.55rem 0.7rem;
  font-family: inherit;
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--navy);
  text-align: right;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-variant-numeric: tabular-nums;
}
.row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.rows.small .row { padding: 0.6rem 1rem; }
.rows.small .row label { font-size: 0.78rem; font-weight: 600; color: var(--text-dim); }
.rows.small .row input { width: 7.5rem; font-size: 0.9rem; padding: 0.5rem 0.6rem; }

details.assume { margin-top: 0.9rem; }
details.assume summary {
  list-style: none;
  cursor: pointer;
  text-align: center;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  padding: 0.4rem;
}
details.assume summary::-webkit-details-marker { display: none; }
details.assume summary::after { content: ' +'; }
details.assume[open] summary::after { content: ' \2013'; }
details.assume summary:hover { color: var(--accent); }
details.assume .rows { margin-top: 0.5rem; }

.reset {
  display: block;
  margin: 0.6rem auto 0;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0.4rem;
}
.reset:hover { color: var(--accent); }

/* Result */
.result {
  background: var(--white);
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 1.6rem 1.4rem 1.1rem;
  text-align: center;
  box-shadow: 0 0 14px var(--accent-glow);
}
.total-label {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 0.2rem;
}
.total {
  font-size: 2.8rem;
  font-weight: 800;
  color: var(--accent);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.per { font-size: 0.88rem; color: var(--text-dim); margin-top: 0.4rem; font-weight: 500;  text-wrap: balance; }
.per span { color: var(--accent); font-weight: 700; }
.empty-state { color: var(--text-dim); font-size: 0.88rem; padding: 0.5rem 0; }

.breakdown { margin-top: 1.2rem; border-top: 1px solid var(--border); padding-top: 0.5rem; text-align: left; }
.b-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 0; }
.b-row .b-label { font-size: 0.88rem; font-weight: 700; color: var(--navy); }
.b-row .b-detail { font-size: 0.76rem; font-weight: 500; color: var(--text-dim); margin-top: 0.1rem; }
.b-row .b-value { font-size: 1rem; font-weight: 800; color: var(--navy); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Timeline image: bleeds to the image's own margins so it lines up with the header above */
.timeline-img { display: block; width: calc(100% + 48px); max-width: none; margin: 0 -24px; height: auto; }

@media (max-width: 480px) {
  .logos { gap: 28px; }
  .logos .adrian { height: 28px; }
  .logos .lushin { height: 21.7px; }
  .title { font-size: 1.05rem; }
  .row input { width: 7rem; }
  .total { font-size: 2.3rem; }
}

@media (prefers-reduced-motion: reduce) { .view { animation: none; } }
</style>
</head>

<script>
// ---- ADRIAN'S NUMBERS (from the Oct 12 call) ----------------------------
// Edit these to change what the page opens with.
const START = {
  underperformers: 6,     // Marc: ~5 RSMs + 1 FAE
  salary: 95000,          // average salary
  evaluate: 25            // people in scope for the SEIA
};

// ---- UNDERPERFORMER ASSUMPTIONS ----------------------------------------
// Starting values for the Assumptions section. "Reset assumptions" puts
// these values back.
const UNDER = {
  coachingHours: 100,     // hours of training and coaching per underperformer
  hourlyRate: 750,        // value of a manager's hour
  lostPerOpp: 20000,      // revenue per lost account or opportunity
  lostPerYear: 2,         // lost accounts or opportunities per year
  years: 2                // average years an underperformer has worked
};

// ---- SEIA PRICING ----------------------------------------------------
// SEIA Findings Report & Dashboards: one flat fee for the whole group.
const REPORT_FEE = 3600;
// Evaluation rate: starts at START_RATE for 1 person, drops by STEP for
// each added person, never below FLOOR_RATE.
const START_RATE = 560;
const STEP = 2;
const FLOOR_RATE = 400;
// -----------------------------------------------------------------------

const $ = id => document.getElementById(id);
const money = v => '$' + Math.round(v).toLocaleString('en-US');
const val = id => parseFloat(String($(id).value).replace(/[^0-9.]/g, '')) || 0;
const fmt = (el, n) => el.hasAttribute('data-money') ? money(n) : n.toLocaleString('en-US');

const assumeInputs = Array.from(document.querySelectorAll('.assume input'));
const A = key => val(assumeInputs.find(el => el.dataset.key === key).id);

const underPerPerson = salary =>
  A('coachingHours') * A('hourlyRate') + salary + A('lostPerOpp') * A('lostPerYear') * A('years');
const rateFor = n => Math.max(FLOOR_RATE, START_RATE - STEP * (n - 1));
const seiaTotal = n => REPORT_FEE + n * rateFor(n);
const formatMultiple = x => (x >= 10 ? Math.round(x).toLocaleString('en-US') : x.toFixed(1)) + 'x';

function resetAssumptions() {
  assumeInputs.forEach(el => { el.value = fmt(el, UNDER[el.dataset.key]); });
}

function calc() {
  const uNum = Math.floor(val('u_num'));
  const one = underPerPerson(val('u_sal'));
  const uTotal = one * uNum;
  const sNum = Math.floor(val('s_num'));
  const sTotal = sNum > 0 ? seiaTotal(sNum) : 0;
  const ready = uTotal > 0 && sTotal > 0;

  $('r_ready').hidden = !ready;
  $('r_empty').hidden = ready;
  if (!ready) return;

  const rate = rateFor(sNum);
  const multiple = uTotal / sTotal;
  $('r_multiple').textContent = formatMultiple(multiple);
  $('r_multiple_text').textContent = formatMultiple(multiple);
  $('u_total').textContent = money(uTotal);
  $('u_detail').textContent = uNum.toLocaleString('en-US') + ' × ' + money(one);
  $('s_total').textContent = money(sTotal);
  $('s_detail').textContent = 'Findings report ' + money(REPORT_FEE) + ' + ' +
    sNum.toLocaleString('en-US') + ' × ' + money(rate);
  $('r_break').textContent = Math.max(1, Math.ceil(sTotal / one)).toLocaleString('en-US');
}

// ---- Tabs (#calculator, #timeline) ----
const views = Array.from(document.querySelectorAll('.view'));
const tabs = Array.from(document.querySelectorAll('.site-tabs a'));
function show(name) {
  if (!views.some(v => v.id === name)) name = 'calculator';
  views.forEach(v => { v.hidden = v.id !== name; });
  tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

// ---- Start with Adrian's numbers ----
$('u_num').value = START.underperformers.toLocaleString('en-US');
$('u_sal').value = money(START.salary);
$('s_num').value = START.evaluate.toLocaleString('en-US');
resetAssumptions();

document.querySelectorAll('input').forEach(el => {
  el.addEventListener('input', () => {
    const digits = el.value.replace(/[^0-9]/g, '');
    el.value = digits ? fmt(el, +digits) : '';
    calc();
  });
});
$('a_reset').addEventListener('click', () => { resetAssumptions(); calc(); });

calc();
show(location.hash.slice(1));
</script>
